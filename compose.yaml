name: fluxo-os
services:
  db:
    image: postgres:17.10
    environment:
      POSTGRES_DB: fluxo
      POSTGRES_USER: fluxo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute scripts/start.ps1 para criar as configuracoes locais}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U fluxo -d fluxo]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      ConnectionStrings__Database: Host=db;Database=fluxo;Username=fluxo;Password=${POSTGRES_PASSWORD}
      ASPNETCORE_ENVIRONMENT: Development
      Demo__Enabled: ${DEMO_ENABLED:-false}
      Database__Migrate: "true"
      Database__Seed: "true"
      Bootstrap__Password: ${BOOTSTRAP_PASSWORD:?Execute scripts/start.ps1}
    volumes:
      - protection_keys:/data/keys
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  database:
  protection_keys:
